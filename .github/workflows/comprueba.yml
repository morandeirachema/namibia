# El candado del build: las mismas comprobaciones de `make comprueba`, en cada push.
# No regenera los PDF (eso pide Chrome y descargas de red): vigila que lo commiteado sea
# coherente — imagenes con licencia y autor, geometria completa, avistamientos con su
# muestra, precios en N$ y €, la escala del PDF y que el README no mienta.
name: comprueba

on:
  push:
  workflow_dispatch:

jobs:
  comprueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: poppler (para leer los PDF) y dependencias de Python
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils
          pip install -q -r fuente/requirements.txt
      - run: make -C fuente comprueba
